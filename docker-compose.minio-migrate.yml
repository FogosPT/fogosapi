# Temporary overlay: keep the existing MinIO process on host port 9000
# (so cdn.fogos.pt / host nginx keep working) and publish the new SeaweedFS
# S3 API on 127.0.0.1:9002 while you copy the bucket.
#
# Compose concatenates `ports` lists, so this file does not add a second
# mapping for fogos.s3. Parameterise the base host port instead:
#
#   S3_HOST_PORT=9002 docker-compose -f docker-compose.yml -f docker-compose.minio-migrate.yml up -d
#
# You can also set S3_HOST_PORT=9002 in .env for the copy window; unset it
# (or set it back to 9000) before the cutover recreates fogos.s3 on 9000.
#
# The MinIO image is not pullable. This file only works on a host that
# already has minio/minio:RELEASE.2023-09-30T07-02-29Z. See docs/s3-migration.md.
# Remove this overlay after the cutover so fogos.s3 takes port 9000.

version: '3.8'

services:
  fogos.minio:
    # No longer pullable: MinIO stopped publishing images (Docker Hub repo
    # removed in 2025). Runs from the copy already on the host; keep a
    # backup (`docker save … | gzip`) and never `docker image prune -a`.
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - 9000
      - 9001
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - fogos
