get:
  operationId: v2GetFireSimulation
  summary: Latest fire spread simulation (PyroCast isochrones up to +6h)
  description: |
    Returns a GeoJSON `FeatureCollection` with the most recent PyroCast fire
    spread simulation. Only one simulation exists at a time (system-wide) —
    `properties.fogos_id` identifies which fogos.pt incident it refers to.
    For a specific incident, use `GET /v2/incidents/{id}/simulation` (reads
    from the per-incident history).

    **What this is NOT.** Not an operational forecast and not a prediction
    of where the fire will go. It is a scenario: "if nothing stops the fire,
    the flame front could reach these polygons at these times". Always show
    it alongside — never instead of — ANEPC information. The
    `properties.disclaimer` field on the response and on each feature
    repeats this caveat.

    Each `Feature` is a cumulative isochrone at hour offset `properties.hour`
    (1 through 6). Hour 6 contains hour 5, which contains hour 4, and so on
    — render in reverse order or use a colour gradient keyed on `hour`.
    When `perturb: true` was requested, the payload also carries
    `properties.uncertainty_bands` and `properties.burn_probability_bands`.

    Data is refreshed hourly by looping over active incidents. Simulations
    are cached in Redis for 24 h so a temporary upstream outage does not
    empty the map. Response includes an `X-Fetched-At` header (ISO 8601)
    with the poll timestamp of the last successful ingestion, and an
    `X-Stale: true` header if the age exceeds 30 min.
  tags:
    - V2
  responses:
    200:
      description: GeoJSON FeatureCollection with a top-level `disclaimer` string.
      headers:
        X-Fetched-At:
          description: ISO 8601 timestamp of the last successful upstream fetch.
          schema:
            type: string
            format: date-time
        X-Stale:
          description: Present as "true" when the snapshot is older than 30 minutes.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
    500:
      $ref: '../../common/responses/500.yaml'
