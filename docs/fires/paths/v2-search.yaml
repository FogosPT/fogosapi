get:
  operationId: V2SearchIncidents
  summary: Search incidents (fires and other ANEPC incidents)
  description: Paginated with `limit` and `page`, newest first (`dateTime` desc, then `_id`).
  tags:
    - V2
  parameters:
    - $ref: '../parameters/query/all.yaml'
    - $ref: '../parameters/query/day.yaml'
    - $ref: '../parameters/query/after.yaml'
    - $ref: '../parameters/query/before.yaml'
    - $ref: '../parameters/query/extend.yaml'
    - $ref: '../parameters/query/concelho-v2.yaml'
    - name: limit
      in: query
      required: false
      description: >-
        Page size (1–1000, default 50). Values above 1000 are clamped to
        1000, below 1 to 1; a non-integer value uses the default. Ignored with `csv2=1`, which exports every match.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    - $ref: '../parameters/query/page.yaml'
  responses:
    200:
      $ref: '../responses/v2-fires-paginated-list.yaml'
    404:
      $ref: '../../common/responses/404.yaml'
    422:
      $ref: '../../common/responses/422.yaml'
    500:
      $ref: '../../common/responses/500.yaml'
