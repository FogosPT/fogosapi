get:
  operationId: v2GetFirePerimetersUncorrelated
  summary: Satellite hot-spot clusters with no ANEPC incident (por confirmar)
  description: |
    Returns a GeoJSON `FeatureCollection` with MTG hot-spot clusters that
    could NOT be correlated with any fogos.pt incident — the satellite has
    detected fire activity but the ANEPC has not opened an incident record
    (or the correlation heuristic did not find a match).

    Purpose: render these on the map alongside the correlated perimeters
    from `/v2/fire/perimeters`, styled distinctly as
    "detecção MTG sem incidente ANEPC associado (por confirmar)". Never
    hide them — they are early warning signals.

    Each feature's `properties.fogospt_incident` is `null`. Data is
    refreshed every 10 minutes from `/api/external/v1/events` upstream and
    cached in Redis for 24 h.
  tags:
    - V2
  responses:
    200:
      description: GeoJSON FeatureCollection with a top-level `disclaimer` string.
      headers:
        X-Fetched-At:
          description: ISO 8601 timestamp of the last successful upstream fetch.
          schema:
            type: string
            format: date-time
        X-Stale:
          description: Present as "true" when the snapshot is older than 30 minutes.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
    500:
      $ref: '../../common/responses/500.yaml'
