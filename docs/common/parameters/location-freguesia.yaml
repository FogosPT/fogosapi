name: freguesia
in: query
required: false
description: >-
  Parish — one or more names from `GET v2/incidents/locations`,
  case-insensitive, separated by `|` (e.g. `Canidelo|Avintes`). A comma also separates
  unless the whole value is a known name (parish names contain commas).
  `district`, `concelho` and `freguesia` are combined with OR: send the
  most specific level of each branch. An unknown name returns `422` with
  `{"success": false, "error": "invalid_freguesia", "invalid": {...}}`.
schema:
  type: string
