get:
  operationId: v2GetWarningsIpma
  summary: Active IPMA weather warnings
  description: |
    Returns the currently-active IPMA weather warnings ingested by the
    `HandleWeatherWarnings` job (collection `weather_warnings`), reshaped to
    match the payload of the upstream IPMA endpoint
    `https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json`.

    Only warnings whose `endTime` is in the future are returned; green-level
    warnings are never persisted upstream of this endpoint. Two entries of the
    same `idAreaAviso` + `awarenessTypeName` never overlap in time: overlapping
    windows are cut so the higher level (then the newest report) wins, and pieces already over are dropped. Results
    are ordered by `startTime` ascending.
  tags:
    - Warnings
  parameters:
    - name: area
      in: query
      required: false
      description: >-
        IPMA area codes (`idAreaAviso`, see `GET v2/warnings/ipma/areas`),
        separated by `,` or `|`. Combined (OR) with `district` / `concelho` /
        `freguesia`, which are resolved to the areas covering them. An unknown
        code returns `422` `invalid_area`.
      schema: { type: string }
    - $ref: '../../common/parameters/location-district.yaml'
    - $ref: '../../common/parameters/location-concelho.yaml'
    - $ref: '../../common/parameters/location-freguesia.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                text:
                  type: string
                  description: Human-readable warning text (Portuguese).
                awarenessTypeName:
                  type: string
                  description: IPMA awareness type (e.g. `Precipitação`, `Vento`).
                idAreaAviso:
                  type: string
                  description: IPMA warning area code (e.g. `BGC`, `AVR`).
                awarenessLevelID:
                  type: string
                  enum: [yellow, orange, red]
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
    500:
      $ref: '../../common/responses/500.yaml'
