type: object
nullable: true
description: Null when no incident in the interval has history for this kind of means.
properties:
  value:
    type: integer
    example: 14
  at:
    type: string
    format: date-time
    description: When the peak was recorded (Europe/Lisbon offset)
    example: '2025-08-10T16:00:00+01:00'
  incident:
    type: object
    description: The incident, same shape as /v2/incidents/active items
