[global]
daemonize = no

[www]
listen = 9000
catch_workers_output = yes

; ~65 MB per worker: 40 workers ≈ 2.6 GB, leaving room on the 8 GB host for
; Redis, the queue workers and the renderer (130 would need ~8.3 GB).
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
